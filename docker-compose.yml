# Production Docker Compose
# Запуск: docker-compose -f docker-compose.prod.yaml --env-file .env.prod up -d


services:
  # ═══════════════════════════════════════════════════════════════
  # Nginx Reverse Proxy + Load Balancer
  # ═══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: spectech-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "8888:80"
      # - "443:443"  # Disabled for local dev
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - frontend
      - backend

  # ═══════════════════════════════════════════════════════════════
  # PostgreSQL Database
  # ═══════════════════════════════════════════════════════════════
  postgres:
    # Запинено: плавающий latest-pg16 сменил базу с glibc на musl под живой БД.
    # Версия расширения в базе: 2.30.1. Обновлять осознанно, с REINDEX при смене libc.
    image: timescale/timescaledb:2.30.1-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9
    container_name: spectech-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    stop_grace_period: 60s
    networks:
      - database
    # NO port exposure in production!

  # ═══════════════════════════════════════════════════════════════
  # Redis Cache
  # ═══════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: spectech-redis
    stop_grace_period: 30s
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - database

  # ═══════════════════════════════════════════════════════════════
  # MinIO S3 Storage
  # ═══════════════════════════════════════════════════════════════
  minio:
    image: minio/minio
    container_name: spectech-minio
    stop_grace_period: 30s
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always
    networks:
      - database


  # ═══════════════════════════════════════════════════════════════
  # Backend (FastAPI)
  # ═══════════════════════════════════════════════════════════════
  backend:
    build:                          # ← ИСПРАВЛЕНО: build вместо image
      context: ./backend
      dockerfile: Dockerfile
    container_name: spectech-backend
    init: true
    stop_grace_period: 45s
    stop_signal: SIGINT
    env_file: .env.prod             # ← ИСПРАВЛЕНО: все переменные из файла
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      ENVIRONMENT: production
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      DEBUG: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: always
    networks:
      - backend
      - database

  # ═══════════════════════════════════════════════════════════════
  # Frontend (Vite + React SPA)
  # ═══════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spectech-frontend
    # Vite использует VITE_* переменные, не NEXT_PUBLIC_*
    # API URL задаётся через Nginx proxy, не через env
    depends_on:
      - backend
    restart: always
    networks:
      - frontend

  # ═══════════════════════════════════════════════════════════════
  # Prometheus - Metrics Collection
  # ═══════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: spectech-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9091:9090"
    depends_on:
      - backend
    restart: always
    networks:
      - backend
      - monitoring

  # ═══════════════════════════════════════════════════════════════
  # Grafana - Metrics Visualization
  # ═══════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:11.2.0
    container_name: spectech-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    restart: always
    networks:
      - monitoring
      - backend


  # ═══════════════════════════════════════════════════════════
  # GlitchTip — Self-hosted Sentry-compatible error tracking
  # ═══════════════════════════════════════════════════════════
  glitchtip:
    image: glitchtip/glitchtip:latest@sha256:c245745b4179667da3aebd73fb8d4f1fd918f7d68ba07d1fd73ea688933b6e01
    container_name: spectech-glitchtip
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-in-production}
      PORT: "8000"
      DEFAULT_FROM_EMAIL: noreply@spectehpro.ru
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-localhost:9090}
      GLITCHTIP_URL: http://${GLITCHTIP_DOMAIN:-localhost:9090}
      ENABLE_OPEN_USER_REGISTRATION: "false"
    ports:
      - "9090:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    networks:
      - database

  # ═══════════════════════════════════════════════════════════
  # Database Backup (on startup + hourly, 30-day retention)
  # ═══════════════════════════════════════════════════════════
  db-backup:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: spectech-db-backup
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
    volumes:
      - ./backend/scripts/backup_db.sh:/backup.sh:ro
      - db_backups:/backups
      - backup_metrics:/metrics
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chmod +x /backup.sh
        # Стартовый бэкап + ежечасный cron. Причина: только cron 02:00 не
        # создаёт файл при дневном рестарте стека — том /backups оставался
        # пуст (инцидент C:), и страховки фактически не существовало.
        # Бэкап сразу при старте устраняет пустой том; hourly держит свежесть.
        /backup.sh 30 >> /var/log/backup.log 2>&1
        echo "0 * * * * /backup.sh 30 >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        # При остановке контейнера удаляем textfile-метрику: иначе общий том
        # переживает остановку, node-exporter продолжает отдавать старый
        # timestamp, и BackupMissing (absent) не отличил бы «сервис лёг» от
        # «бэкап устарел». crond в фоне + wait, чтобы sh принял SIGTERM и trap.
        trap 'rm -f /metrics/backup_last_success.prom; exit 0' TERM INT
        crond -f -l 2 &
        wait $!
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - database

  # ═══════════════════════════════════════════════════════════════
  # Exporters — делают 7 инфраструктурных алертов не слепыми.
  # Без них pg_up / redis_up / node_filesystem_* / container_last_seen
  # не имеют ни одной серии, и правила infrastructure_alerts формально
  # "ok", но не сработают никогда. Сети: database — доступ к БД/redis,
  # monitoring — scrape со стороны Prometheus.
  # ═══════════════════════════════════════════════════════════════
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: spectech-postgres-exporter
    environment:
      # Отдельный пользователь spectech_exporter с ролью pg_monitor
      # (минимальные права на чтение статистики), пароль — из env, не хардкодим.
      DATA_SOURCE_NAME: "postgresql://spectech_exporter:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - database
      - monitoring

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: spectech-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    networks:
      - database
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: spectech-node-exporter
    # DiskSpaceLow должен мерить диск хоста (Docker VM), а не контейнера:
    # файловая система хоста пробрасывается через rootfs/procfs/sysfs.
    command:
      - '--path.rootfs=/host/root'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)'
      # textfile-метрика возраста бэкапа: db-backup пишет backup_last_success.prom
      # в общий том backup_metrics, node-exporter отдаёт её Prometheus.
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile'
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - backup_metrics:/var/lib/node_exporter/textfile:ro
    restart: always
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: spectech-cadvisor
    # Минимальные привилегии вместо privileged: container-метрики (включая
    # container_last_seen для ContainerRestarting) читаются из cgroups через
    # ro-монтирования /sys, /var/lib/docker и docker-socket /var/run.
    # privileged не требуется и мог дестабилизировать Docker Desktop VM.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: always
    networks:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_uploads:
  backend_logs:
  nginx_logs:
  prometheus_data:
  grafana_data:
  db_backups:
  backup_metrics:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  database:
    driver: bridge
  monitoring:
    driver: bridge
