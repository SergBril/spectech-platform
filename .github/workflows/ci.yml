name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Lint ───────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff lint
        working-directory: backend
        run: ruff check app/ --output-format=github

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check app/

  # ─── Backend Tests ──────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spectech_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test  # pragma: allowlist secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio alembic psycopg2-binary

      - name: Check pending migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/spectech_test  # pragma: allowlist secret
        run: alembic check || echo "::warning::Pending migrations detected"

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/spectech_test  # pragma: allowlist secret
        run: alembic upgrade head

      - name: Check schema drift
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/spectech_test  # pragma: allowlist secret
        run: python scripts/check_schema_drift.py
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/spectech_test  # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
          TESTING: "true"
          SECRET_KEY: ci-test-secret-key  # pragma: allowlist secret
          DADATA_API_KEY: ""
          MAX_ENABLED: "false"
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=95 --tb=short -q

  # ─── Security Scan ──────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + bandit
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Bandit SAST
        working-directory: backend
        run: bandit -r app/ -ll -ii --exit-zero

      - name: pip-audit dependency scan
        working-directory: backend
        run: pip-audit --strict || echo "::warning::Vulnerable dependencies found"


  # ─── Frontend Unit Tests ──────────────────────────────────
  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test:unit

  # ─── E2E Tests ──────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run E2E
        working-directory: frontend
        run: npx playwright test --reporter=line
