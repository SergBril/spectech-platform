apiVersion: batch/v1
kind: Job
metadata:
  name: load-test-heavy
  namespace: spectech
spec:
  parallelism: 10
  completions: 200
  template:
    spec:
      containers:
      - name: load-test
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            for i in $(seq 1 200); do
              curl -s http://backend:8000/api/v1/system/health > /dev/null &
              sleep 0.05
            done
            wait
      restartPolicy: Never
