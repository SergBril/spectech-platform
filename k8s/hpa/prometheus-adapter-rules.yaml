apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-rules
  namespace: monitoring
  labels:
    app: prometheus-adapter
data:
  config.yaml: |
    rules:
    - seriesQuery: 'http_requests_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^(.*)_total"
        as: "http_requests_per_second"
      metricsQuery: |
        sum(
          rate(
            <<.Series>>{<<.LabelMatchers>>}[2m]
          )
        ) by (<<.GroupBy>>)
