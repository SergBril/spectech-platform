apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app: kube-prometheus-stack
spec:
  groups:
    - name: cert-manager.rules
      rules:
        - alert: CertificateExpiringSoon
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 24 * 60 * 60
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Сертификат {{ $labels.name }} истекает менее чем через 14 дней"
            description: "Сертификат в namespace {{ $labels.namespace }}."

        - alert: CertificateNotReady
          expr: |
            certmanager_certificate_ready_status{condition="True"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Сертификат {{ $labels.name }} не Ready"
            description: "Сертификат не в состоянии Ready более 10 минут."

        - alert: ClusterIssuerNotReady
          expr: |
            certmanager_clusterissuer_ready_status{condition="True"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "ClusterIssuer {{ $labels.name }} не Ready"
            description: "ClusterIssuer не в состоянии Ready более 15 минут."
