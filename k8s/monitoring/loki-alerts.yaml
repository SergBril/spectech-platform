apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loki-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app: kube-prometheus-stack
spec:
  groups:
    - name: loki.rules
      rules:
        - alert: LokiRequestErrors
          expr: |
            100 * sum(rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m])) by (namespace, job, route)
            / sum(rate(loki_request_duration_seconds_count[5m])) by (namespace, job, route) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Loki request errors > 10%"
            description: "Loki возвращает более 10% 5xx ошибок."

        - alert: LokiRequestPanic
          expr: |
            sum(increase(loki_panic_total[10m])) by (namespace, job) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Loki panic detected"
            description: "Loki имел panic за последние 10 минут."
