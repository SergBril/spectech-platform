user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide Nginx version for security
    server_tokens off;

    # ═══════════════════════════════════════════════════════════
    # Rate Limiting Zones (DDoS protection)
    # ═══════════════════════════════════════════════════════════

    # General API rate limit: 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Strict rate limit for login/auth: 5 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Very strict for sensitive endpoints: 1 request/second
    limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=1r/s;

    # Connection limit: max 20 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    # $uri вместо $request: путь БЕЗ query. В query ездит сессионный JWT
    # (WebSocket ?token=), и писать его в access.log открытым текстом нельзя.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
