# Development Docker Compose
# Запуск: docker-compose -f docker-compose.dev.yaml up -d

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: spectech-postgres-dev
    environment:
      POSTGRES_USER: spectech
      POSTGRES_PASSWORD: spectech
      POSTGRES_DB: spectech
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectech"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - database

  redis:
    image: redis:7-alpine
    container_name: spectech-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - database

  minio:
    image: minio/minio
    container_name: spectech-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: spectech
      MINIO_ROOT_PASSWORD: spectech123
    volumes:
      - minio_dev_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - database

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spectech-backend-dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://spectech:spectech@postgres:5432/spectech
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:80
      ENVIRONMENT: development
      SENTRY_DSN: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    restart: unless-stopped
    networks:
      - backend
      - database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spectech-frontend-dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/ws
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - frontend
      - backend

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  database:
    driver: bridge
