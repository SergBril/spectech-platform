version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: spectech
      POSTGRES_PASSWORD: spectech
      POSTGRES_DB: spectech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: spectech
      MINIO_ROOT_PASSWORD: spectech123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  redis_data:
  minio_data: