deploymentMode: SingleBinary

loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
  auth_enabled: false
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    reject_old_samples: false
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    query_timeout: 300s
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    per_stream_rate_limit: 5MB
    per_stream_rate_limit_burst: 15MB
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Отключаем ненужные компоненты для SingleBinary
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Отключаем gateway (не нужен для SingleBinary)
gateway:
  enabled: false

# MinIO не нужен для filesystem storage
minio:
  enabled: false

# Отключаем кэши для простоты
chunksCache:
  enabled: false
resultsCache:
  enabled: false
