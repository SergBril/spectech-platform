apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  labels:
    {{- include "spectech.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.credentials.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.credentials.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.credentials.postgres.database | quote }}
  MINIO_ROOT_USER: {{ .Values.credentials.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.credentials.minio.rootPassword | quote }}
