apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
    {{- include "spectech.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "spectech.backend.selectorLabels" . | nindent 4 }}
  ports:
  - port: {{ .Values.backend.service.port }}
    targetPort: {{ .Values.backend.service.port }}
    protocol: TCP
